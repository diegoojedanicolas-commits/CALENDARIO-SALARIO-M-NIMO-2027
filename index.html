<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concertación del Salario Mínimo 2027</title>
<style>
:root{
  --bg:#ffffff;
  --ink:#111111;
  --muted:#6b6b6b;
  --subtle:#9a9a9a;
  --line:#ececec;
  --border:#dcdcdc;
  --soft:#fafafa;
  --red:#d0021b;
  --slate:#555555;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
}

/* Contenedor muy estrecho optimizado para móvil e inserción vertical en notas */
.embed-wrap{
  max-width:480px;
  margin:0 auto;
  padding:16px 12px 24px;
}

button{font:inherit;color:inherit;cursor:pointer}

/* Cabecera editorial compacta */
.kicker{
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:6px;
}
.kicker b{color:var(--red);font-weight:700}

h1{
  border-top:3px solid var(--red);
  padding-top:12px;
  font:700 22px/1.12 Georgia,"Times New Roman",serif;
  margin:0 0 6px;
  letter-spacing:-.015em;
}

.lead{
  color:var(--muted);
  font-size:13.5px;
  margin:0 0 14px;
}
.lead strong{color:var(--ink);font-weight:600}

/* Controles compactos en barra vertical/ajustada */
.toolbar{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:8px;
  padding:8px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin-bottom:12px;
}
@media (min-width:380px){
  .toolbar{flex-direction:row;align-items:center;justify-content:space-between;}
}

.seg{
  display:flex;
  border:1px solid var(--border);
  border-radius:4px;
  overflow:hidden;
}
.seg button{
  flex:1;
  background:#fff;
  border:0;
  padding:5px 10px;
  font-size:11.5px;
  font-weight:600;
  color:var(--muted);
  min-height:32px;
  text-align:center;
}
.seg button + button{border-left:1px solid var(--border)}
.seg button[aria-selected=true]{
  background:var(--ink);
  color:#fff;
}

.toggle-empty{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:transparent;
  border:1px solid var(--border);
  border-radius:999px;
  padding:4px 10px;
  font-size:11.5px;
  color:var(--muted);
  min-height:32px;
}
.toggle-empty[aria-pressed=true]{
  border-color:var(--ink);
  color:var(--ink);
  font-weight:600;
  background:var(--soft);
}
.toggle-empty .dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--subtle);
}
.toggle-empty[aria-pressed=true] .dot{background:var(--red)}

/* Leyenda verticalmente más compacta */
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:6px 12px;
  font-size:11px;
  color:var(--muted);
  margin-bottom:12px;
}
.legend span{
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.legend i{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:2px;
}

/* Tira horizontal deslizable compacta */
.strip-wrap{
  margin:0 -12px 14px;
  padding:0 12px;
}
.strip-label{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:6px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.strip-label span{font-weight:400;text-transform:none;font-size:11px}

.day-strip{
  display:flex;
  gap:6px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  padding-bottom:4px;
  scrollbar-width:none;
}
.day-strip::-webkit-scrollbar{display:none}

.chip{
  flex:0 0 auto;
  scroll-snap-align:start;
  min-width:58px;
  padding:6px 8px;
  background:#fff;
  border:1px solid var(--border);
  border-top:3px solid var(--ink);
  border-radius:3px;
  text-align:center;
}
.chip.type-legal{border-top-color:var(--red)}
.chip.type-tech{border-top-color:var(--slate)}
.chip[aria-current=true]{
  background:var(--ink);
  border-color:var(--ink);
  color:#fff;
}
.chip.type-legal[aria-current=true]{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}
.chip .ch-d{
  display:block;
  font-size:9.5px;
  text-transform:uppercase;
  opacity:.75;
}
.chip .ch-n{
  display:block;
  font:700 16px/1.1 Georgia,"Times New Roman",serif;
  margin:1px 0;
}
.chip .ch-m{
  display:block;
  font-size:9.5px;
  opacity:.85;
}

/* =========================================================
   VISTA 1: LISTA CRONOLÓGICA ESTRECHA
   ========================================================= */
.month-divider{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  border-bottom:2px solid var(--ink);
  padding:10px 0 4px;
  margin-top:6px;
}
.month-divider h2{
  font:700 17px/1.1 Georgia,"Times New Roman",serif;
  margin:0;
}
.month-divider span{
  font-size:11px;
  color:var(--muted);
}

.agenda-group{
  border-bottom:1px solid var(--line);
}

.day-row{
  border-bottom:1px solid var(--line);
}
.day-row:last-child{border-bottom:0}
.day-row.is-empty{display:none}
.show-all .day-row.is-empty{display:block}

.row-muted{
  display:grid;
  grid-template-columns:56px 1fr;
  gap:10px;
  align-items:center;
  padding:7px 2px;
  color:var(--subtle);
  font-size:11.5px;
  background:var(--soft);
}
.row-muted .rm-date{
  font:400 13px/1.1 Georgia,"Times New Roman",serif;
}
.row-muted .rm-date small{
  display:block;
  font-size:9.5px;
  text-transform:uppercase;
}

.row-btn{
  width:100%;
  appearance:none;
  background:transparent;
  border:0;
  text-align:left;
  display:grid;
  grid-template-columns:56px 1fr 16px;
  gap:8px;
  align-items:start;
  padding:10px 4px;
  border-left:3px solid var(--ink);
}
.day-row.type-legal .row-btn{border-left-color:var(--red)}
.day-row.type-tech .row-btn{border-left-color:var(--slate)}

.day-row.open .row-btn,
.row-btn:hover{
  background:var(--soft);
}
.day-row.type-legal.open .row-btn{
  background:#fffafa;
}

.rb-date{padding-top:1px}
.rb-num{
  display:block;
  font:700 18px/1 Georgia,"Times New Roman",serif;
  color:var(--ink);
}
.day-row.type-legal .rb-num{color:var(--red)}
.rb-day{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-top:1px;
}

.rb-body{min-width:0}
.rb-top{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:4px 6px;
  margin-bottom:2px;
}
.rb-badge{
  display:inline-block;
  font-size:9px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  padding:1px 4px;
  border-radius:2px;
  background:#f0f0f0;
  color:var(--ink);
}
.day-row.type-legal .rb-badge{background:var(--red);color:#fff}
.day-row.type-tech .rb-badge{background:#ececec;color:var(--slate)}
.rb-time{
  font-size:11px;
  color:var(--muted);
}
.rb-title{
  font-size:13.5px;
  font-weight:600;
  line-height:1.28;
  color:var(--ink);
}

.rb-chev{
  font-size:14px;
  line-height:1;
  color:var(--muted);
  padding-top:3px;
  text-align:right;
  transition:transform .2s;
}
.day-row.open .rb-chev{
  transform:rotate(180deg);
  color:var(--ink);
}

.row-detail{
  display:none;
  padding:0 8px 10px 66px;
  border-left:3px solid var(--ink);
  background:var(--soft);
  font-size:12.5px;
  color:#333;
}
.day-row.type-legal .row-detail{border-left-color:var(--red);background:#fffafa}
.day-row.type-tech .row-detail{border-left-color:var(--slate)}
.day-row.open .row-detail{display:block}
.row-detail p{margin:0}
.row-detail ul{margin:4px 0 0;padding-left:16px}
.row-detail li{margin:2px 0}

/* =========================================================
   VISTA 2: CUADRÍCULA CALENDARIO ESTRECHA
   ========================================================= */
.cal-section{margin-bottom:16px}
.cal-wkhead{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--muted);
  padding:6px 0 4px;
}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
}
.c-cell{
  appearance:none;
  text-align:left;
  background:#fff;
  border:1px solid var(--line);
  border-radius:3px;
  padding:6px 5px 8px;
  min-height:78px;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
}
.c-cell.empty,
.c-cell.holiday{
  background:var(--soft);
  border-color:#efefef;
}
.c-cell.active{
  cursor:pointer;
  border-top:2px solid var(--ink);
}
.c-cell.type-legal{border-top-color:var(--red)}
.c-cell.type-tech{border-top-color:var(--slate)}
.c-cell.selected{
  outline:2px solid var(--ink);
  outline-offset:-2px;
}
.c-cell.type-legal.selected{
  outline-color:var(--red);
  background:#fffafa;
}
.c-num{
  font:700 14px/1 Georgia,"Times New Roman",serif;
  margin-bottom:3px;
}
.c-cell.empty .c-num,
.c-cell.holiday .c-num{
  color:var(--subtle);
  font-weight:400;
}
.c-sub{
  font-size:9.5px;
  line-height:1.2;
  color:var(--ink);
  font-weight:600;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.c-cell.holiday .c-sub{color:var(--subtle);font-weight:400}

.grid-detail{
  background:var(--soft);
  border:1px solid var(--line);
  border-left:3px solid var(--ink);
  padding:10px 12px;
  margin-top:10px;
}
.grid-detail.type-legal{border-left-color:var(--red);background:#fffafa}
.grid-detail.type-tech{border-left-color:var(--slate)}
.gd-meta{
  font-size:10.5px;
  color:var(--muted);
  margin-bottom:3px;
}
.gd-meta b{
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--ink);
}
.grid-detail.type-legal .gd-meta b{color:var(--red)}
.gd-title{
  font:700 15px/1.2 Georgia,"Times New Roman",serif;
  margin:0 0 4px;
}
.gd-desc{
  font-size:12.5px;
  color:#333;
  margin:0;
}
.gd-list{
  margin:4px 0 0;
  padding-left:16px;
  font-size:12.5px;
  color:#333;
}

[hidden]{display:none !important}

/* Pie compacto */
.src{
  margin-top:20px;
  padding-top:10px;
  border-top:1px solid var(--line);
  font-size:10.5px;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  gap:4px;
}
.src strong{color:var(--ink);font-weight:600}
</style>
</head>

  function renderStrip(){
    var activeDays = DAYS.filter(function(d){ return d.state === "active"; });
    $("day-strip").innerHTML = activeDays.map(function(d){
      return '<button type="button" class="chip type-'+d.type+'" data-id="'+d.id+'" aria-current="'+(d.id === activeId)+'">' +
        '<span class="ch-d">'+d.shortD+'</span>' +
        '<span class="ch-n">'+d.num+'</span>' +
        '<span class="ch-m">'+d.shortM+'</span>' +
      '</button>';
    }).join("");
  }

  function renderList(){
    var months = ["Noviembre 2026", "Diciembre 2026"];
    $("view-list").innerHTML = months.map(function(m){
      var list = DAYS.filter(function(d){ return d.month === m; });
      var activeCount = list.filter(function(d){ return d.state === "active"; }).length;
      var rowsHtml = list.map(function(d){
        if(d.state !== "active"){
          return '<div class="day-row is-empty" data-id="'+d.id+'">' +
            '<div class="row-muted">' +
              '<div class="rm-date">'+d.num+' '+d.shortM+'<small>'+d.day+'</small></div>' +
              '<div>'+d.note+'</div>' +
            '</div>' +
          '</div>';
        }
        var isOpen = (d.id === activeId);
        var bullets = d.bullets ? '<ul>'+d.bullets.map(function(b){ return '<li>'+b+'</li>'; }).join("")+'</ul>' : '';
        return '<div class="day-row type-'+d.type+(isOpen ? ' open' : '')+'" id="row-'+d.id+'" data-id="'+d.id+'">' +
          '<button type="button" class="row-btn" data-toggle="'+d.id+'" aria-expanded="'+isOpen+'">' +
            '<div class="rb-date"><span class="rb-num">'+d.num+' '+d.shortM+'</span><span class="rb-day">'+d.day+'</span></div>' +
            '<div class="rb-body">' +
              '<div class="rb-top"><span class="rb-badge">'+d.badge+'</span><span class="rb-time">'+d.time+'</span></div>' +
              '<div class="rb-title">'+d.title+'</div>' +
            '</div>' +
            '<div class="rb-chev" aria-hidden="true">▾</div>' +
          '</button>' +
          '<div class="row-detail"><p>'+d.desc+'</p>'+bullets+'</div>' +
        '</div>';
      }).join("");

      return '<section aria-label="'+m+'">' +
        '<div class="month-divider"><h2>'+m+'</h2><span>'+activeCount+' clave</span></div>' +
        '<div class="agenda-group">'+rowsHtml+'</div>' +
      '</section>';
    }).join("");
  }

  function renderGrid(){
    var months = ["Noviembre 2026", "Diciembre 2026"];
    $("grid-container").innerHTML = months.map(function(m){
      var list = DAYS.filter(function(d){ return d.month === m; });
      var cells = list.map(function(d){
        if(d.state === "empty"){
          return '<div class="c-cell empty" aria-hidden="true"><span class="c-num">'+d.num+'</span></div>';
        }
        if(d.state === "holiday"){
          return '<div class="c-cell holiday"><span class="c-num">'+d.num+'</span><span class="c-sub">Festivo</span></div>';
        }
        var sel = (d.id === activeId) ? " selected" : "";
        return '<button type="button" class="c-cell active type-'+d.type+sel+'" data-pick="'+d.id+'">' +
          '<span class="c-num">'+d.num+'</span>' +
          '<span class="c-sub">'+d.title+'</span>' +
        '</button>';
      }).join("");

      return '<div class="cal-section">' +
        '<div class="month-divider"><h2>'+m+'</h2><span>Lun–Vie</span></div>' +
        '<div class="cal-wkhead" aria-hidden="true"><div>L</div><div>M</div><div>M</div><div>J</div><div>V</div></div>' +
        '<div class="cal-grid">'+cells+'</div>' +
      '</div>';
    }).join("");
    updateGridDetail();
  }

  function updateGridDetail(){
    var d = BY_ID[activeId];
    if(!d || d.state !== "active") return;
    var box = $("grid-detail");
    box.className = "grid-detail type-" + d.type;
    var bullets = d.bullets ? '<ul class="gd-list">'+d.bullets.map(function(b){ return '<li>'+b+'</li>'; }).join("")+'</ul>' : '';
    box.innerHTML = '<div class="gd-meta"><b>'+d.badge+'</b> · '+d.day+' '+d.num+' de '+d.month.toLowerCase()+'</div>' +
      '<h3 class="gd-title">'+d.title+'</h3>' +
      '<p class="gd-desc">'+d.desc+'</p>' + bullets;
  }

  function selectDate(id, opts){
    opts = opts || {};
    var d = BY_ID[id];
    if(!d || d.state !== "active") return;
    activeId = id;

    document.querySelectorAll(".chip").forEach(function(c){
      var isCur = c.dataset.id === id;
      c.setAttribute("aria-current", isCur);
      if(isCur && opts.scrollChip){
        c.scrollIntoView({ behavior:"smooth", inline:"center", block:"nearest" });
      }
    });

    document.querySelectorAll(".day-row[id]").forEach(function(r){
      var isMatch = r.dataset.id === id;
      var shouldOpen = opts.toggle ? (isMatch ? !r.classList.contains("open") : false) : isMatch;
      r.classList.toggle("open", shouldOpen);
      var btn = r.querySelector(".row-btn");
      if(btn) btn.setAttribute("aria-expanded", shouldOpen);
    });

    if(opts.scrollRow && currentView === "list"){
      var targetRow = $("row-" + id);
      if(targetRow) targetRow.scrollIntoView({ behavior:"smooth", block:"nearest" });
    }

    document.querySelectorAll(".c-cell.active").forEach(function(c){
      c.classList.toggle("selected", c.dataset.pick === id);
    });
    updateGridDetail();
  }

  function setView(view){
    currentView = view;
    $("tab-list").setAttribute("aria-selected", view === "list");
    $("tab-grid").setAttribute("aria-selected", view === "grid");
    $("view-list").hidden = (view !== "list");
    $("view-grid").hidden = (view !== "grid");
    $("btn-empty").hidden = (view !== "list");
  }

  renderStrip();
  renderList();
  renderGrid();
  setView(currentView);

  document.addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if(chip){ selectDate(chip.dataset.id, { scrollRow:true }); return; }

    var rowBtn = e.target.closest(".row-btn");
    if(rowBtn){ selectDate(rowBtn.dataset.toggle, { toggle:true, scrollChip:true }); return; }

    var cell = e.target.closest(".c-cell.active");
    if(cell){ selectDate(cell.dataset.pick, { scrollChip:true }); return; }

    var tab = e.target.closest("[data-view]");
    if(tab){ setView(tab.dataset.view); return; }

    if(e.target.closest("#btn-empty")){
      showEmpty = !showEmpty;
      $("btn-empty").setAttribute("aria-pressed", showEmpty);
      $("view-list").classList.toggle("show-all", showEmpty);
    }
  });
})();
</script>
</body>
</html>
